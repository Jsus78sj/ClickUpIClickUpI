name: Build Windows EXE
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        default: "v1.1.0"
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: CivilDraft ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: desktop/release/*.exe
